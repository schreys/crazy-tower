<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />
    <title>Crazy Tower</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0618;
        color: #fff;
        overflow: hidden;
        font-family: "Arial Black", Impact, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
      }
      canvas {
        height: min(calc(100dvh - 130px), 160vw);
        aspect-ratio: 480 / 800;
        background: #000;
        border: 4px solid #ff2bd6;
        border-radius: 12px;
        box-shadow: 0 0 30px #ff2bd6aa;
      }
      #btn {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        border: 6px solid #7a0000;
        cursor: pointer;
        background: radial-gradient(
          circle at 35% 30%,
          #ff8080,
          #e00000 55%,
          #900000
        );
        box-shadow:
          0 8px 0 #500,
          0 0 25px #f008;
        color: #fff;
        font: inherit;
        font-size: 15px;
      }
      #btn:active {
        transform: translateY(6px);
        box-shadow:
          0 2px 0 #500,
          0 0 25px #f00c;
      }
      #controls {
        position: relative;
      }
      #music {
        position: absolute;
        left: 110px;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid #3cf;
        background: #0a0618;
        color: #3cf;
        font-size: 22px;
        cursor: pointer;
      }
      #music.off {
        opacity: 0.35;
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="480" height="800"></canvas>
      <div id="controls">
        <button id="btn">DROP</button>
        <button id="music" title="Muziek aan/uit (M)">&#9835;</button>
      </div>
    </div>
    <script src="music.js?v=15"></script>
    <script src="game.js?v=15"></script>
  </body>
</html>
